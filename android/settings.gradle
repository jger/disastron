pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    resolutionStrategy {
        eachPlugin {
            // background_downloader pins the kotlinx-serialization compiler
            // plugin to 2.1.0, but this project compiles with Kotlin 2.3.20.
            // The serialization compiler plugin must match the Kotlin compiler
            // version exactly; a 2.1.0 plugin under a 2.3.20 compiler mangles
            // the plugin's @Serializable classes (Models, Auth, BDPlugin…),
            // producing cascading "Unresolved reference 'BDPlugin'" errors.
            // Force it up to the project's Kotlin version to keep them aligned.
            if (requested.id.id == 'org.jetbrains.kotlin.plugin.serialization') {
                useVersion('2.3.20')
            }
        }
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.13.1" apply false
    id "org.jetbrains.kotlin.android" version "2.3.20" apply false
}

include ":app"
