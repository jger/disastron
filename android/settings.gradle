pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    resolutionStrategy {
        eachPlugin {
            // background_downloader pins the kotlinx-serialization compiler
            // plugin to 2.1.0, matching the project's Kotlin version (2.1.0).
            if (requested.id.id == 'org.jetbrains.kotlin.plugin.serialization') {
                useVersion('2.1.0')
            }
        }
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.13.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

include ":app"

// Workaround for Patrol + native-assets packages (flutter_gemma_litertlm):
// when Gradle is invoked with exactly one task like :app:assembleDebugAndroidTest
// (which is what patrol_cli does for the test APK), the Flutter Gradle plugin's
// shouldConfigureFlutterTask heuristic (flutter/flutter#109560) skips registering
// compileFlutterBuildDebug — but the plugin's native-assets copyJniLibs wiring
// still looks that task up while computing mergeDebugJniLibFolders dependencies,
// failing with "Task with name 'compileFlutterBuildDebug' not found".
// Requesting the matching plain assemble task alongside makes the plugin
// configure normally (and the extra task is an up-to-date no-op after
// patrol's preceding assembleDebug invocation).
def requestedTasks = gradle.startParameter.taskNames
if (requestedTasks.size() == 1
        && requestedTasks.first().contains('assemble')
        && requestedTasks.first().endsWith('AndroidTest')) {
    def baseTask = requestedTasks.first().replaceAll(/AndroidTest$/, '')
    gradle.startParameter.setTaskNames([baseTask, requestedTasks.first()])
}
