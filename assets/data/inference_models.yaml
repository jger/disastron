# Curated preset .task / .litertlm models for offline inference.
# Users can still install from any URL in Settings.
#
# SSOT — default/smallest preset for dashboard download CTA and first-time install.
# Must match exactly one models[].id below.
#
# Metadata (verified on Hugging Face):
#   size_mb     — approximate download size
#   access      — public (anonymous OK) | gated (HF token + Gemma license)
#   backend     — litert | mediapipe (determines runtime engine; mediapipe supports dynamic LoRA)
#   multimodal  — supports image input in chat when true
#   supports_lora — model supports dynamic LoRA adapter loading (mediapipe only)
default_preset_id: gemma4_e2b_litertlm

models:
  - id: gemma3_270m_q8
    title: Gemma 3 270M IT (q8)
    description: Smallest chat preset. Dynamic LoRA adapter support. Requires Hugging Face token.
    url: https://huggingface.co/litert-community/gemma-3-270m-it/resolve/main/gemma3-270m-it-q8.task
    model_type: gemmaIt
    backend: mediapipe
    size_mb: 304
    access: gated
    multimodal: false
    requires_token: true
    supports_lora: true

