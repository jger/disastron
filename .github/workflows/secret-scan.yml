name: Secret and artifact scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Block forbidden tracked paths
        run: |
          set -euo pipefail
          forbidden='\.jks$|key\.properties$|google-services\.json$|GoogleService-Info\.plist$|local\.properties$'
          if git ls-files | grep -E "$forbidden"; then
            echo "Forbidden sensitive or machine-local files are tracked."
            exit 1
          fi
          echo "No forbidden tracked paths."

      - name: Block model weight extensions in tracked files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(task|litertlm|bin)$'; then
            echo "Model weight or binary artifacts must not be committed."
            exit 1
          fi
          echo "No model weight blobs tracked."

      - name: Block large tracked files
        run: |
          set -euo pipefail
          large=$(git ls-files -z | xargs -0 -I{} sh -c 'test -f "{}" && wc -c < "{}" | awk -v f="{}" "{if (\$1 > 10485760) print f, \$1}"')
          if [ -n "$large" ]; then
            echo "Tracked files larger than 10 MB:"
            echo "$large"
            exit 1
          fi
          echo "No oversized tracked files."
