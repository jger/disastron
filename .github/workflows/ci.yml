name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    if: "github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.5'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Generate files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze project source
        run: dart analyze --fatal-infos --fatal-warnings .

      - name: Run tests
        run: flutter test
